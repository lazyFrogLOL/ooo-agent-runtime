# OOO benchmark 场景 patch（headless 用，OOO loop 实验组）。
#
# 用法（仓库根目录）：
#   time pnpm dsh --profile headless \
#     --patch packages/experimental/ooo-mock-lab/bench-ooo.patch.yml \
#     "分析这家公司"
#
# 与 bench.patch.yml 是同一批逻辑工作，但组织成 DAG：
#   4 个 TOOL 节点（mock_fetch，2000/1500/1000/500ms，并发）
#   4 个 REASON 节点（各 500ms，依赖各自 fetch，就绪即跑，挤占单核）
#   1 个 REASON 综合节点（500ms，依赖全部分析）
#
# OOO 预期：fetch 全部在 t≈0 派发；研报 500ms 一到，分析研报立刻上核，
# 与仍在跑的财报/公告/新闻抓取重叠。核心从 500ms 起排满 5×500ms，
# makespan ≈ 500 + 2500 = 3000ms（vs 默认 loop 基线 ≈ 5000ms）。
#
# 模型脚本用 match 按内容路由：OOO 驱动每个 REASON 节点发一次独立请求，
# 请求顺序取决于调度器，不能用顺序脚本。

- id: agent-loop
  disabled: true

- id: agent-default-model
  config:
    provider: mock
    model: mock-1

- id: session-title-llm
  disabled: true

- insert:
    - id: ooo-loop
      name: "@deepseek-ai/dsh-ooo-loop"
      config:
        agents: []
        dag:
          tracePath: dsh-ooo-trace.json
          nodes:
            - id: fetch-report
              name: 拉取财报
              kind: tool
              tool: mock_fetch
              arguments:
                topic: 财报
                latencyMs: 2000
            - id: fetch-announce
              name: 拉取公告
              kind: tool
              tool: mock_fetch
              arguments:
                topic: 公告
                latencyMs: 1500
            - id: fetch-news
              name: 拉取新闻
              kind: tool
              tool: mock_fetch
              arguments:
                topic: 新闻
                latencyMs: 1000
            - id: fetch-research
              name: 拉取研报
              kind: tool
              tool: mock_fetch
              arguments:
                topic: 研报
                latencyMs: 500
            - id: analyze-report
              name: 分析财报
              kind: reason
              prompt: 分析财报数据，给出要点。
              dependsOn: [fetch-report]
            - id: analyze-announce
              name: 分析公告
              kind: reason
              prompt: 分析公告内容，给出要点。
              dependsOn: [fetch-announce]
            - id: analyze-news
              name: 分析新闻
              kind: reason
              prompt: 分析新闻舆情，给出要点。
              dependsOn: [fetch-news]
            - id: analyze-research
              name: 分析研报
              kind: reason
              prompt: 分析研报观点，给出要点。
              dependsOn: [fetch-research]
            - id: synthesize
              name: 综合结论
              kind: reason
              prompt: 综合以上四路分析，给出投资结论。
              dependsOn: [analyze-report, analyze-announce, analyze-news, analyze-research]
    - id: ooo-mock-lab
      name: "@deepseek-ai/dsh-ooo-mock-lab"
      config:
        provider: mock
        thinkMs: 500
        script:
          - match: 分析财报
            text: 财报分析：营收利润双增，现金流健康。
          - match: 分析公告
            text: 公告分析：近期无重大不利公告。
          - match: 分析新闻
            text: 新闻分析：舆情中性偏正面。
          - match: 分析研报
            text: 研报分析：三家券商维持买入评级。
          - match: 综合结论
            text: 综合结论：基本面稳健，舆情偏正面，建议关注。
