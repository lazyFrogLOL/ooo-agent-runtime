# OOO benchmark 场景 patch（headless 用，L3 慢工具正面对决 · 默认 loop 基线）。
#
# 用法（仓库根目录）：
#   DEEPSEEK_API_KEY="$KIMI_API_KEY" \
#   DEEPSEEK_BASE_URL=https://agent-gw.kimi.com/coding \
#   pnpm dsh --profile headless \
#     --patch packages/experimental/ooo-mock-lab/bench-l3-baseline.patch.yml \
#     "请用 fetch_data 工具并行获取「财报」「公告」「新闻」「研报」四路数据（每个 topic 调用一次），拿到全部结果后综合分析，给出投资结论。"
#
# 与 bench-l3-slow.patch.yml（OOO loop）是同一批逻辑工作：
# 4 路 fetch_data（财报 90s 慢工具 + 3 路快数据）+ 全部分析 + 综合。
# 默认 loop 下模型一次性并行发起 4 个 fetch，join 屏障等满 90s，
# 快数据的分析无法与慢抓取重叠——这就是 OOO 要消灭的窗口。
#
# 计时：scripts/extract-timing.py 解析会话日志。

- id: agent-default-model
  config:
    provider: deepseek-official
    model: kimi-k2-0905-preview

# 标题生成会额外消耗真实模型调用，且与 benchmark 无关，禁用。
- id: session-title-llm
  disabled: true

- insert:
    - id: ooo-mock-lab
      name: /Users/chenwenhong/NewDocuments/Agent_Infra/deepseek-harness/packages/experimental/ooo-mock-lab/lib/index.js
      config:
        # 只借用工具；模型走真实路由。
        script: []
        topics:
          财报: 2026 上半年财报：营收 128.4 亿元（同比 +34.2%），归母净利润 21.7 亿元（同比 +41.5%），经营性现金流 18.9 亿元，毛利率 42.1%（同比 +2.3pct），研发费用 15.2 亿元（占营收 11.8%），应收账款同比 +52%。
          公告: 近期公告：拟以 6.5 亿元收购某传感器企业 51% 股权；完成 12 亿元定向增发；无重大诉讼、处罚或商誉减值风险披露。
          新闻: 近 30 天舆情：新品发布会获 42 家媒体报道，正面占比 68%；有 2 篇质疑应收账款增速的报道，未形成发酵。
          研报: 券商研报：3 家维持买入、1 家增持；目标价中位数 58 元；核心逻辑为海外订单放量与毛利率改善，普遍提示应收账款与并购整合风险。
        latencies:
          财报: 90000
          公告: 1500
          新闻: 1000
          研报: 500
